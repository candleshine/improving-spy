[project]
name = "improving-spy"
version = "0.1.0"
description = "A teachable, functional AI RPG engine using Pydantic AI and FastAPI"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.116.1",
    "fastcrud>=0.15.12",
    "sqlalchemy>=2.0.43",
    "uvicorn>=0.35.0",
    "greenlet>=3.2.4",
    "logfire[fastapi]>=4.3.3",
    "pydantic-ai>=0.7.2",
    "ollama>=0.5.3",
    "textual>=5.3.0",
    "httpx>=0.28.1",
    "websockets>=15.0.1",
    "pydantic-ai-slim[openai]>=0.7.2",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "black",
    "isort",
    "mypy"
]

[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main"]

[project.scripts]
improving-spy = "main:main"
